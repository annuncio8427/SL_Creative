<!-- Micro-interaction JS for Particles and Password Toggle -->
<script>
        // Password Visibility Toggle
        function togglePassword() {
            const passwordInput = document.getElementById('password');
            const visibilityIcon = document.getElementById('visibilityIcon');
            
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                visibilityIcon.textContent = 'visibility_off';
            } else {
                passwordInput.type = 'password';
                visibilityIcon.textContent = 'visibility';
            }
        }

        // Minimalist Golden Particle Background
        const canvas = document.getElementById('particleCanvas');
        const ctx = canvas.getContext('2d');
        
        let width, height;
        let particles = [];

        function init() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            particles = [];
            for(let i = 0; i < 50; i++) {
                particles.push(new Particle());
            }
        }

        class Particle {
            constructor() {
                this.x = Math.random() * width;
                this.y = Math.random() * height;
                this.size = Math.random() * 2;
                this.speedX = Math.random() * 0.5 - 0.25;
                this.speedY = Math.random() * -1 - 0.5; // Drift upwards
                this.opacity = Math.random() * 0.5;
            }
            
            update() {
                this.x += this.speedX;
                this.y += this.speedY;
                
                if (this.y < 0) {
                    this.y = height;
                    this.x = Math.random() * width;
                }
            }
            
            draw() {
                ctx.fillStyle = `rgba(242, 202, 80, ${this.opacity})`;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        function animate() {
            ctx.clearRect(0, 0, width, height);
            for (let i = 0; i < particles.length; i++) {
                particles[i].update();
                particles[i].draw();
            }
            requestAnimationFrame(animate);
        }

        window.addEventListener('resize', init);
        init();
        animate();
    </script>
<script id="global-nav-router">
document.addEventListener('DOMContentLoaded', () => {
    const routeMap = [
        { keywords: ['home', 'sl creative', 'logo'], target: 'index.html' },
        { keywords: ['work', 'portfolio', 'selected works', 'explore our work'], target: 'portfolio.html' },
        { keywords: ['services', 'disciplines', 'services & pricing'], target: 'services.html' },
        { keywords: ['about', 'our story', 'who we are'], target: 'about.html' },
        { keywords: ['team', 'our team'], target: 'team.html' },
        { keywords: ['careers'], target: 'careers.html' },
        { keywords: ['contact', 'get in touch'], target: 'contact.html' },
        { keywords: ['book', 'consultation', 'book a consultation', 'book a project'], target: 'book.html' },
        { keywords: ['login', 'sign in', 'client portal login'], target: 'login.html' },
        { keywords: ['create account', 'register', 'sign up', 'join'], target: 'create-account.html' },
        { keywords: ['forgot password', 'reset link'], target: 'forgot-password.html' },
        { keywords: ['dashboard', 'client portal', 'overview'], target: 'dashboard.html' },
        { keywords: ['timeline', 'milestones'], target: 'timeline.html' },
        { keywords: ['project details'], target: 'project-details.html' },
        { keywords: ['files', 'assets library'], target: 'files.html' },
        { keywords: ['upload'], target: 'file-upload.html' },
        { keywords: ['invoice', 'invoices'], target: 'invoice.html' },
        { keywords: ['pricing calculator', 'estimate'], target: 'pricing-calculator.html' },
        { keywords: ['quote'], target: 'quote.html' },
        { keywords: ['resources', 'downloads'], target: 'resources.html' },
        { keywords: ['support', 'help desk'], target: 'support.html' },
        { keywords: ['privacy policy'], target: 'privacy-policy.html' },
        { keywords: ['terms & conditions', 'terms of service', 'terms'], target: 'terms-conditions.html' },
        { keywords: ['cookie policy'], target: 'cookie-policy.html' },
        { keywords: ['cancellation policy'], target: 'cancellation-policy.html' },
        { keywords: ['refund policy'], target: 'refund-policy.html' },
        { keywords: ['licensing', 'nda'], target: 'licensing-nda.html' }
    ];

    document.querySelectorAll('a, button').forEach(elem => {
        const text = (elem.innerText || elem.getAttribute('aria-label') || '').trim().toLowerCase();
        const currentHref = elem.getAttribute('href');

        if (!currentHref || currentHref === '#' || currentHref === '' || currentHref.startsWith('javascript:')) {
            for (const route of routeMap) {
                if (route.keywords.some(kw => text === kw || text.includes(kw))) {
                    if (elem.tagName.toLowerCase() === 'a') {
                        elem.setAttribute('href', route.target);
                    } else {
                        elem.addEventListener('click', (e) => {
                            e.preventDefault();
                            window.location.href = route.target;
                        });
                    }
                    break;
                }
            }
        }
    });
});
</script>
