<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width,initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }
  </style>
</head>
<body>
<!-- STITCH_SHADER_START:ANIMATION_40 class="fixed inset-0 w-full h-full" -->
<div class="fixed inset-0 w-full h-full" style="display:block;">
<canvas id="shader-canvas-ANIMATION_40" style="display:block;width:100%;height:100%"></canvas>
<script>
(function() {
  const canvas = document.getElementById('shader-canvas-ANIMATION_40');

  // Sync the WebGL drawing-buffer size with the CSS-driven layout size.
  // This fires on initial layout and whenever the element is resized.
  function syncSize() {
    const w = canvas.clientWidth  || 1280;
    const h = canvas.clientHeight || 720;
    if (canvas.width !== w || canvas.height !== h) {
      canvas.width  = w;
      canvas.height = h;
    }
  }
  if (typeof ResizeObserver !== 'undefined') {
    new ResizeObserver(syncSize).observe(canvas);
  }
  syncSize();

  const gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');
  if (!gl) return;
  const vs = `attribute vec2 a_position;
varying vec2 v_texCoord;
void main() {
  v_texCoord = a_position * 0.5 + 0.5;
  gl_Position = vec4(a_position, 0.0, 1.0);
}`;
  const fs = `precision highp float;
uniform float u_time;
uniform vec2 u_resolution;
varying vec2 v_texCoord;

// Simplex noise function
vec3 permute(vec3 x) { return mod(((x*34.0)+1.0)*x, 289.0); }
float snoise(vec2 v){
  const vec4 C = vec4(0.211324865405187, 0.366025403784439,
           -0.577350269189626, 0.024390243902439);
  vec2 i  = floor(v + dot(v, C.yy) );
  vec2 x0 = v -   i + dot(i, C.xx);
  vec2 i1;
  i1 = (x0.x > x0.y) ? vec2(1.0, 0.0) : vec2(0.0, 1.0);
  vec4 x12 = x0.xyxy + C.xxzz;
  x12.xy -= i1;
  i = mod(i, 289.0);
  vec3 p = permute( permute( i.y + vec3(0.0, i1.y, 1.0 ))
  + i.x + vec3(0.0, i1.x, 1.0 ));
  vec3 m = max(0.5 - vec3(dot(x0,x0), dot(x12.xy,x12.xy),
    dot(x12.zw,x12.zw)), 0.0);
  m = m*m ;
  m = m*m ;
  vec3 x = 2.0 * fract(p * C.wwww) - 1.0;
  vec3 h = abs(x) - 0.5;
  vec3 a0 = x - floor(x + 0.5);
  m *= 1.79284291400159 - 0.85373472095314 * ( a0*a0 + h*h );
  vec3 g;
  g.x  = a0.x  * x0.x  + h.x  * x0.y;
  g.yz = a0.yz * x12.xz + h.yz * x12.yw;
  return 130.0 * dot(m, g);
}

void main() {
    vec2 uv = v_texCoord;
    
    // Create a dark, flowing golden smoke effect
    float noise1 = snoise(uv * 2.0 + u_time * 0.1);
    float noise2 = snoise(uv * 4.0 - u_time * 0.15);
    float combinedNoise = (noise1 + noise2 * 0.5);
    
    // Colors from the design system
    vec3 black = vec3(0.035, 0.035, 0.035); // #090909 equivalent
    vec3 gold = vec3(0.831, 0.686, 0.216);  // #D4AF37 equivalent
    
    // Mix colors based on noise
    float colorStrength = smoothstep(-0.5, 1.5, combinedNoise);
    vec3 finalColor = mix(black, gold * 0.15, colorStrength);
    
    // Add subtle bright highlights
    float highlight = smoothstep(0.8, 1.0, combinedNoise);
    finalColor += gold * highlight * 0.2;
    
    gl_FragColor = vec4(finalColor, 1.0);
}`;
  function cs(type, src) {
    const s = gl.createShader(type);
    gl.shaderSource(s, src);
    gl.compileShader(s);
    return s;
  }
  const prog = gl.createProgram();
  gl.attachShader(prog, cs(gl.VERTEX_SHADER, vs));
  gl.attachShader(prog, cs(gl.FRAGMENT_SHADER, fs));
  gl.linkProgram(prog);
  gl.useProgram(prog);
  const buf = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, buf);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW);
  const pos = gl.getAttribLocation(prog, 'a_position');
  gl.enableVertexAttribArray(pos);
  gl.vertexAttribPointer(pos, 2, gl.FLOAT, false, 0, 0);
  const uTime = gl.getUniformLocation(prog, 'u_time');
  const uRes = gl.getUniformLocation(prog, 'u_resolution');
  const uMouse = gl.getUniformLocation(prog, 'u_mouse');

  // u_mouse is in pixel coordinates matching u_resolution (ShaderToy convention).
  // Shaders that need normalized coords should use: u_mouse / u_resolution.
  let mouse = { x: canvas.width / 2, y: canvas.height / 2 };
  window.addEventListener('mousemove', (event) => {
    const rect = canvas.getBoundingClientRect();
    if (rect.width && rect.height) {
      const nx = (event.clientX - rect.left) / rect.width;
      const ny = 1.0 - (event.clientY - rect.top) / rect.height;
      mouse.x = nx * canvas.width;
      mouse.y = ny * canvas.height;
    }
  });

  function render(t) {
    if (typeof ResizeObserver === 'undefined') syncSize();
    gl.viewport(0, 0, canvas.width, canvas.height);
    if (uTime) gl.uniform1f(uTime, t * 0.001);
    if (uRes) gl.uniform2f(uRes, canvas.width, canvas.height);
    if (uMouse) gl.uniform2f(uMouse, mouse.x, mouse.y);
    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
    requestAnimationFrame(render);
  }
  render(0);
})();
</script>
</div>
<!-- STITCH_SHADER_END:ANIMATION_40 -->

<script id="global-nav-router">
document.addEventListener('DOMContentLoaded', () => {
    const routeMap = [
        { keywords: ['home', 'sl creative', 'logo'], target: 'index.html' },
        { keywords: ['work', 'portfolio', 'selected works', 'explore our work'], target: 'portfolio.html' },
        { keywords: ['services', 'disciplines', 'services & pricing'], target: 'services.html' },
        { keywords: ['about', 'our story', 'who we are'], target: 'about.html' },
        { keywords: ['team', 'our team'], target: 'team.html' },
        { keywords: ['careers'], target: 'careers.html' },
        { keywords: ['contact', 'get in touch'], target: 'contact.html' },
        { keywords: ['book', 'consultation', 'book a consultation', 'book a project'], target: 'book.html' },
        { keywords: ['login', 'sign in', 'client portal login'], target: 'login.html' },
        { keywords: ['create account', 'register', 'sign up', 'join'], target: 'create-account.html' },
        { keywords: ['forgot password', 'reset link'], target: 'forgot-password.html' },
        { keywords: ['dashboard', 'client portal', 'overview'], target: 'dashboard.html' },
        { keywords: ['timeline', 'milestones'], target: 'timeline.html' },
        { keywords: ['project details'], target: 'project-details.html' },
        { keywords: ['files', 'assets library'], target: 'files.html' },
        { keywords: ['upload'], target: 'file-upload.html' },
        { keywords: ['invoice', 'invoices'], target: 'invoice.html' },
        { keywords: ['pricing calculator', 'estimate'], target: 'pricing-calculator.html' },
        { keywords: ['quote'], target: 'quote.html' },
        { keywords: ['resources', 'downloads'], target: 'resources.html' },
        { keywords: ['support', 'help desk'], target: 'support.html' },
        { keywords: ['privacy policy'], target: 'privacy-policy.html' },
        { keywords: ['terms & conditions', 'terms of service', 'terms'], target: 'terms-conditions.html' },
        { keywords: ['cookie policy'], target: 'cookie-policy.html' },
        { keywords: ['cancellation policy'], target: 'cancellation-policy.html' },
        { keywords: ['refund policy'], target: 'refund-policy.html' },
        { keywords: ['licensing', 'nda'], target: 'licensing-nda.html' }
    ];

    document.querySelectorAll('a, button').forEach(elem => {
        const text = (elem.innerText || elem.getAttribute('aria-label') || '').trim().toLowerCase();
        const currentHref = elem.getAttribute('href');

        if (!currentHref || currentHref === '#' || currentHref === '' || currentHref.startsWith('javascript:')) {
            for (const route of routeMap) {
                if (route.keywords.some(kw => text === kw || text.includes(kw))) {
                    if (elem.tagName.toLowerCase() === 'a') {
                        elem.setAttribute('href', route.target);
                    } else {
                        elem.addEventListener('click', (e) => {
                            e.preventDefault();
                            window.location.href = route.target;
                        });
                    }
                    break;
                }
            }
        }
    });
});
</script>

</body>
</html>
