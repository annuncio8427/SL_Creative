<!DOCTYPE html>

<html class="dark" lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Reels - SL Creative</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700&amp;family=Be+Vietnam+Pro:wght@400;600&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<style>
    :root { --gold:#f2ca50; --bg:#090909; --muted:#d0c5af; }
    * { box-sizing:border-box; }
    html { scroll-behavior:smooth; }
    body { margin:0; background:var(--bg); color:#e5e2e1; font-family:"Be Vietnam Pro",sans-serif; }
    .glass { background:rgba(26,26,26,.72); backdrop-filter:blur(18px); border:1px solid rgba(153,144,124,.22); }
    .reel-card { break-inside:avoid; margin-bottom:24px; }
    .reel-media { position:relative; aspect-ratio:9/16; overflow:hidden; background:#111; }
    .reel-media video { width:100%; height:100%; object-fit:cover; display:block; }
    .reel-media video { cursor:pointer; }
    .shade { position:absolute; inset:0; background:linear-gradient(to top,rgba(0,0,0,.88),transparent 48%,rgba(0,0,0,.08)); pointer-events:none; }
    .play { position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); width:58px; height:58px; border-radius:50%; display:grid; place-items:center; background:rgba(0,0,0,.55); border:1px solid rgba(242,202,80,.65); color:var(--gold); transition:.25s; }
    .reel-media:hover .play { transform:translate(-50%,-50%) scale(1.08); background:rgba(242,202,80,.12); }
    .filters { overflow-x:auto; scrollbar-width:none; }
    .filters::-webkit-scrollbar { display:none; }
    .filter { white-space:nowrap; }
    .filter.active { background:var(--gold); color:#241a00; border-color:var(--gold); }
    @media (min-width:768px) { .reel-grid { columns:2; column-gap:24px; } }
    @media (min-width:1100px) { .reel-grid { columns:4; } }
    @media (max-width:767px) { .reel-grid { columns:2; column-gap:10px; } .reel-card { margin-bottom:10px; } }
    .cursor { position:fixed; width:36px; height:36px; border:1px solid var(--gold); border-radius:50%; pointer-events:none; z-index:9999; transform:translate(-50%,-50%); mix-blend-mode:difference; }
  </style>
<link href="css/site-overrides.css" rel="stylesheet"/></head>
<body>
<div class="cursor hidden md:block" id="cursor"></div>
<header class="fixed top-0 left-0 right-0 z-50 bg-[#131313]/75 backdrop-blur-xl border-b border-[#4d4635]/40">
<div class="max-w-[1440px] mx-auto px-6 md:px-20 py-4 flex items-center justify-between">
<a class="font-['Outfit'] text-2xl font-semibold tracking-tight" href="index.html">SL Creative</a>

<a class="hidden md:inline-flex bg-[#f2ca50] text-[#241a00] px-5 py-3 rounded-sm text-xs font-bold uppercase tracking-[.15em]" href="book.html">Book a Consultation</a>
<button aria-label="Menu" class="md:hidden text-white"><span class="material-symbols-outlined">menu</span></button>
</div>
</header>
<main class="max-w-[1440px] mx-auto px-6 md:px-20 pt-32 pb-28">
<section class="mb-10 md:mb-14">
<p class="text-[#f2ca50] text-xs font-bold uppercase tracking-[.2em] mb-4">SL Creative / Reels</p>
<div class="flex flex-col md:flex-row md:items-end md:justify-between gap-6">
<div>
<h1 class="font-['Outfit'] text-5xl md:text-7xl font-bold tracking-tight">Reels</h1>
<p class="text-[#d0c5af] text-base md:text-lg max-w-2xl mt-5">
            A vertical showcase of our short-form visual work — cinematic edits, weddings, commercials, travel stories and social campaigns.
          </p>
</div>
<a class="text-xs font-bold uppercase tracking-[.15em] text-[#f2ca50]" href="portfolio.html">← Back to Work</a>
</div>
</section>
<section class="filters flex gap-3 pb-3 mb-8" id="filters">
<button class="filter active px-5 py-2.5 rounded-full border border-[#f2ca50] text-xs font-bold uppercase tracking-[.15em]" data-category="All">All</button>
<button class="filter px-5 py-2.5 rounded-full border border-[#99907c] text-[#d0c5af] text-xs font-bold uppercase tracking-[.15em]" data-category="Social Media">Social Media</button>
<button class="filter px-5 py-2.5 rounded-full border border-[#99907c] text-[#d0c5af] text-xs font-bold uppercase tracking-[.15em]" data-category="Brand Marketing">Brand Marketing</button>
<button class="filter px-5 py-2.5 rounded-full border border-[#99907c] text-[#d0c5af] text-xs font-bold uppercase tracking-[.15em]" data-category="Candid">Candid</button>
<button class="filter px-5 py-2.5 rounded-full border border-[#99907c] text-[#d0c5af] text-xs font-bold uppercase tracking-[.15em]" data-category="Wedding">Wedding</button>
<button class="filter px-5 py-2.5 rounded-full border border-[#99907c] text-[#d0c5af] text-xs font-bold uppercase tracking-[.15em]" data-category="Birthday">Birthday</button>
</section>
<section class="reel-grid" id="reelGrid"></section>
</main>
<footer class="border-t border-[#4d4635]/30 py-16">
<div class="max-w-[1440px] mx-auto px-6 md:px-20 flex flex-col md:flex-row items-center justify-between gap-6">
<div class="font-['Outfit'] text-2xl font-semibold text-[#f2ca50]">SL Creative</div>
<div class="flex gap-6 text-xs font-bold uppercase tracking-[.15em]">
<a class="text-[#d0c5af] hover:text-[#f2ca50]" href="https://www.instagram.com/sl_creative__">Instagram</a>
<a class="text-[#d0c5af] hover:text-[#f2ca50]" href="privacy-policy.html">Privacy Policy</a>
</div>
<div class="text-sm text-[#d0c5af]">© 2026 SL Creative. All Rights Reserved.</div>
</div>
</footer>
<script>
    /*
      ADD YOUR REELS HERE.

      Each video needs:
      - file: the MP4 path
      - category: one of the category names below
      - title: title shown on the card

      Example:
      { file: "videos/wedding-01.mp4", category: "Wedding", title: "Golden Vows" }

      You can add unlimited videos to any category.
    */
    const reels = [
      // Wedding
      

      // Cinematic
      { file: "cad1.mp4", category: "Candid", title: "Echoes in Gold" },
      { file: "cad2.mp4", category: "Candid", title: "Midnight Story" },

      // Brand Marketing
      { file: "ad1.mp4", category: "Brand Marketing", title: "Precision Timing" },
      { file: "ad2.mp4", category: "Brand Marketing", title: "Urban Sanctuary" },
      { file: "ad4.mp4", category: "Brand Marketing", title: "Urban Sanctuary" },
      { file: "ad5.mp4", category: "Brand Marketing", title: "Urban Sanctuary" },

      // Social Media
      { file: "ad3.mp4", category: "Social Media", title: "The Alchemist" },
      { file: "reel1.mp4", category: "Social Media", title: "Social Story" },
      { file: "reel2.mp4", category: "Social Media", title: "Social Story" },
      // { file: "reel3.mp4", category: "Social Media", title: "Social Story" },

      { file: "wed1.mp4", category: "Wedding", title: "Golden Vows" },
      { file: "wed2.mp4", category: "Wedding", title: "Eternal Horizons" },
      { file: "wed3.mp4", category: "Wedding", title: "Golden Vows" },
      { file: "wed4.mp4", category: "Wedding", title: "Eternal Horizons" },

      // Travel
      // { file: "trav1.mp4", category: "Birthday", title: "Alpine Pursuit" },
      // { file: "trav2.mp4", category: "Birthday", title: "Beyond the Horizon" }
    ];

    const filters = document.querySelectorAll(".filter");
    const grid = document.getElementById("reelGrid");

    function createReelCard(reel) {
      const card = document.createElement("article");
      card.className = "reel-card glass rounded-lg overflow-hidden";
      card.dataset.category = reel.category;

      card.innerHTML = `
        <div class="reel-media">
          <video
            preload="auto"
            playsinline
            src="${reel.file}"
          ></video>

          <div class="shade"></div>

          <button class="play" aria-label="Play reel">
            <span class="material-symbols-outlined">play_arrow</span>
          </button>

          <div class="absolute left-4 right-4 bottom-4">
            <p class="text-[#f2ca50] text-[10px] font-bold uppercase tracking-[.18em]">
              ${reel.category}
            </p>
            <h2 class="font-['Outfit'] text-xl font-semibold mt-1">
              ${reel.title}
            </h2>
          </div>
        </div>
      `;

      const video = card.querySelector("video");
      const playButton = card.querySelector(".play");

      /*
        Poster replacement:
        Load the real video and automatically seek to 1 second.
        This gives each card a frame from the actual video instead
        of using a separate poster image.
      */
      video.addEventListener("loadedmetadata", () => {
        const previewTime = Math.min(1, Math.max(0, video.duration - 0.05));
        video.currentTime = previewTime;
      });

      video.addEventListener("seeked", () => {
        video.pause();
      }, { once: true });

      playButton.addEventListener("click", () => {
        if (video.paused) {
          document.querySelectorAll("#reelGrid video").forEach(v => {
            if (v !== video) {
              v.pause();
              const otherButton = v.closest(".reel-media")?.querySelector(".play");
              if (otherButton) {
                otherButton.innerHTML =
                  '<span class="material-symbols-outlined">play_arrow</span>';
              }
            }
          });

          // Enable sound when the visitor explicitly presses Play.
          video.muted = false;
          video.volume = 1.0;

          video.play().catch(error => {
            console.warn("Video playback was blocked:", error);
          });

          playButton.innerHTML =
            '<span class="material-symbols-outlined">pause</span>';
        } else {
          video.pause();
          playButton.innerHTML =
            '<span class="material-symbols-outlined">play_arrow</span>';
        }
      });

      video.addEventListener("ended", () => {
        playButton.innerHTML =
          '<span class="material-symbols-outlined">play_arrow</span>';
      });

      return card;
    }

    function renderReels(category = "All") {
      grid.innerHTML = "";

      reels
        .filter(reel => category === "All" || reel.category === category)
        .forEach(reel => grid.appendChild(createReelCard(reel)));
    }

    function setCategory(category) {
      filters.forEach(button => {
        button.classList.toggle(
          "active",
          button.dataset.category === category
        );
      });

      renderReels(category);

      const url =
        category === "All"
          ? "reels.html"
          : "reels.html?category=" + encodeURIComponent(category);

      history.replaceState(null, "", url);
    }

    filters.forEach(button => {
      button.addEventListener("click", () => {
        setCategory(button.dataset.category);
      });
    });

    // Load category from URL when entering from Portfolio.
    const params = new URLSearchParams(window.location.search);
    const initialCategory = params.get("category");

    if (
      initialCategory &&
      [...filters].some(button => button.dataset.category === initialCategory)
    ) {
      setCategory(initialCategory);
    } else {
      renderReels("All");
    }

    // Custom cursor.
    const cursor = document.getElementById("cursor");

    if (cursor && matchMedia("(pointer:fine)").matches) {
      document.addEventListener("mousemove", event => {
        cursor.style.left = event.clientX + "px";
        cursor.style.top = event.clientY + "px";
      });
    }
  </script>
<script src="js/site-shell.js"></script></body>
</html>
